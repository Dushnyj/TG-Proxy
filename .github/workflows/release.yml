name: TG Proxy Android CI and Release
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release TG Proxy Android {0}', github.event.inputs.tag) || startsWith(github.ref, 'refs/tags/') && format('Release TG Proxy Android {0}', github.ref_name) || format('Verify TG Proxy Android {0}', github.ref_name) }}

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  check:
    name: Verify
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          IS_RELEASE="false"
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            IS_RELEASE="true"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
            IS_RELEASE="true"
          fi
          GRADLE_VERSION="$(grep -E 'versionName "' app/build.gradle | sed -E 's/.*versionName "([^"]+)".*/\1/')"
          VERSION="$GRADLE_VERSION"
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION="${TAG#v}"
            if [ "$VERSION" != "$GRADLE_VERSION" ]; then
              echo "Tag version $VERSION does not match Gradle versionName $GRADLE_VERSION" >&2
              exit 1
            fi
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing secrets
        if: steps.version.outputs.is_release == 'true'
        shell: bash
        run: |
          test -n "${{ secrets.ANDROID_SIGNING_KEY_B64 }}"
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}"
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run Android unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

  build-android:
    name: Build signed Android APKs
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.is_release == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.1.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Decode Android signing keystore
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "${{ secrets.ANDROID_SIGNING_KEY_B64 }}" | base64 -d > "$RUNNER_TEMP/signing/release.jks"

      - name: Build Android release APKs
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare Android artifact directory
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          OUT_DIR="$RUNNER_TEMP/android-artifacts"
          mkdir -p "$OUT_DIR"
          echo "OUT_DIR=$OUT_DIR" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Collect Android APKs
        shell: bash
        run: |
          APK_DIR="app/build/outputs/apk/release"
          copy_apk() {
            local label="$1"
            local pattern="$2"
            local src=""
            src="$(find "$APK_DIR" -maxdepth 1 -type f -name "$pattern" | sort | head -n1 || true)"
            if [ -z "$src" ]; then
              echo "Missing release APK for $label" >&2
              find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print >&2
              exit 1
            fi
            cp "$src" "$OUT_DIR/TG-Proxy-v${VERSION}-android-${label}-release.apk"
          }

          copy_apk "arm64-v8a" "*arm64-v8a*release*.apk"
          copy_apk "armeabi-v7a" "*armeabi-v7a*release*.apk"
          copy_apk "x86_64" "*x86_64*release*.apk"
          copy_apk "universal" "*universal*release*.apk"

      - name: Verify Android APK signatures
        shell: bash
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner"
          for apk in "$OUT_DIR"/*.apk; do
            "$APKSIGNER" verify --verbose "$apk"
          done

      - name: Generate Android checksums
        shell: bash
        run: |
          cd "$OUT_DIR"
          sha256sum *.apk > SHA256SUMS.txt

      - name: List Android artifacts
        shell: bash
        run: ls -lh "$OUT_DIR"

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: tg-proxy-android-${{ needs.check.outputs.version }}
          path: ${{ runner.temp }}/android-artifacts/*
          if-no-files-found: error

  publish:
    name: Publish Android GitHub Release
    runs-on: ubuntu-latest
    if: needs.check.outputs.is_release == 'true'
    needs:
      - check
      - build-android

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3
        with:
          ref: ${{ needs.check.outputs.tag }}

      - name: Download Android APK artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: tg-proxy-android-${{ needs.check.outputs.version }}
          path: release-artifacts

      - name: List release artifacts
        shell: bash
        run: ls -lh release-artifacts

      - name: Prepare release notes
        shell: bash
        run: |
          VERSION="${{ needs.check.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { capture=1; next }
            capture && $0 ~ "^## \\[" { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            {
              echo "TG Proxy Android $VERSION"
              echo
              echo "See CHANGELOG.md for details."
            } > release-notes.md
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          name: TG Proxy Android v${{ needs.check.outputs.version }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: release-artifacts/*
